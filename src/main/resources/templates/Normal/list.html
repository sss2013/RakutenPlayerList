<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Player</title>
    <link href="/main.css" rel="stylesheet">
    <link href="/navbar.css" rel="stylesheet">
    <link href="/card.css" rel="stylesheet">
    <link href="/form.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{ Normal/nav.html :: navbar }"></div>

<div class="page-wrapper">
    <div class="search-bar">
        <p style="width:100%; margin:0 0 8px; font-size:13px; color:#666;">フルネームで検索する場合、苗字と名前の間に空白を入れてください</p>
        <input id="searchInput" type="text" placeholder="選手検索">
        <button class="btn btn-primary search-button">検索</button>
    </div>

    <div class="player-grid player-list">
        <div class="card" th:if="${players != null}" th:each="player : ${players}">
            <a th:href="@{/playerInfo/{backNumber}(backNumber=${player.backNumber})}">
                <img class="card-img" th:src="${player.src}" alt="player's image">
            </a>
            <div class="card-body">
                <p class="card-name" th:text="${player.name}"></p>
                <p class="card-sub" th:text="'#' + ${player.backNumber}"></p>
                <p class="card-sub">追加した人：<span th:text="${player.who}"></span></p>
            </div>
        </div>
        <div th:if="${players == null}">
            <p>選手情報がありません</p>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script>
    $('.search-button').on('click', function () {
        let keyword = $('#searchInput').val()

        fetch('/search', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({playerName: keyword})
        })
            .then(res => {
                if (!res.ok) {
                    console.log(res);
                    throw new Error('Server Error');
                }
                return res.json()
            })
            .then(data => {
                renderPlayerList(data);
            })
            .catch(function (error) {
                alert('サーバエラーが生じました、後でもう一度試してください');
            })
    })

    function renderPlayerList(players) {
        let html = '';

        if (players.length === 0) {
            html += '<div>選手情報がありません</div>';
        } else {
            players.forEach(function (player) {
                html += `
                <div class="card">
                    <a href="/playerInfo/${player.backNumber}">
                        <img class="card-img" src="${player.src}" alt="player's image">
                    </a>
                    <div class="card-body">
                        <p class="card-name">${player.name}</p>
                        <p class="card-sub">#${player.backNumber}</p>
                        <p class="card-sub">追加した人：<span>${player.who}</span></p>
                    </div>
                </div>
            `;
            });
        }

        $('.player-list').html(html);
    }

</script>

</body>
</html>
