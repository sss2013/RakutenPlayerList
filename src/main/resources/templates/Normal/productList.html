<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>グッズリスト</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link href="/main.css" rel="stylesheet">
    <link href="/navbar.css" rel="stylesheet">

</head>
<body>
<div th:replace="~{ Normal/nav.html :: navbar }"></div>

<div class="product-list">
    <div class="box" th:if="${products != null}" th:each="product : ${products}">
        <a th:href="@{/products/{id}(id=${product.id})}">
            <img th:src="${product.image}" alt="prdouct's image">
        </a>
        <div>
            <h4 th:text="${product.name}"></h4>
            <p th:text="${#numbers.formatDecimal(product.price,0,'COMMA',0,'COMMA')} + ' 円'"></p>
        </div>
    </div>
    <div th:if="${products == null}">
        <p>商品情報がありません</p>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</body>
</html>
