<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>選手情報更新</title>
    <link href="/navbar.css" rel="stylesheet">
    <link href="/form.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{ Normal/nav.html :: navbar }"></div>

<div class="form-container">
    <h2 class="form-title">選手情報更新</h2>

    <form action="/playerUpdate" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" name="info" th:value="${player.backNumber}">

        <div class="form-group">
            <label>選手名</label>
            <input type="text" name="name" th:value="${player.name}">
        </div>
        <div class="form-group">
            <label>背番号</label>
            <input type="text" name="backNumber" th:value="${player.backNumber}">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px;">転送</button>
    </form>
</div>
</body>
</html>
