<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <title>Add Player</title>
    <link href="/navbar.css" rel="stylesheet">
    <link href="/form.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{ Normal/nav.html :: navbar }"></div>

<div class="form-container">
    <h2 class="form-title">選手追加</h2>

    <form action="/playerAdd" method="POST">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="form-group">
            <label>選手名</label>
            <input type="text" name="name" placeholder="苗字と名前の間に空白を入れてください">
        </div>
        <div class="form-group">
            <label>背番号</label>
            <input type="text" name="backNumber" placeholder="0〜150">
        </div>
        <div class="form-group">
            <label>選手画像</label>
            <input type="file" onchange="getURL(this)">
        </div>
        <input type="hidden" name="url" value="">

        <div>
            <img class="uploaded-image" src="" alt="アップロードされたイメージ">
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:16px;">転送</button>
    </form>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

<script>
    async function getURL(e) {
        let name = encodeURIComponent(e.files[0].name)
        let result = await fetch('/presigned-url?filename=' + name)
        result = await result.text()

        let upload = await fetch(result, {
            method: 'PUT',
            body: e.files[0]
        })

        console.log(upload.url.split("?")[0]);

        if (upload.ok) {
            const imageUrl = upload.url.split("?")[0];
            $('.uploaded-image').attr('src', upload.url.split("?")[0]);
            $('input[name="url"]').val(imageUrl);
        }
    }
</script>

</body>
</html>
